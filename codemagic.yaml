# MOWR — Codemagic CI: build the iOS app on cloud macOS and ship it to
# TestFlight. (No Mac needed locally.)
#
# ONE-TIME SETUP you must do (account actions — I can't do these for you):
#   1. Enrol in the Apple Developer Program ($99/yr)  — required for TestFlight.
#   2. In App Store Connect, create an app:
#        Bundle ID: uk.co.mowr.mowr   ·   Name: MOWR   ·   Platform: iOS
#        (Codemagic matches the app by this bundle id — no Apple ID needed.)
#   3. Create an App Store Connect API key (Users and Access → Integrations →
#        App Store Connect API): download the .p8, note the Key ID + Issuer ID.
#   4. In Codemagic: Teams → Integrations → App Store Connect → add that key,
#        and name the integration "mowr" (or change the name
#        under `integrations` below to match).
#   5. Connect this git repo to Codemagic (GitHub/GitLab/Bitbucket), then run
#        the `ios-testflight` workflow.
#
# Optional: to enable Mapbox tiles + live postcode lookup in the build, add
# encrypted env vars MAPBOX_TOKEN and IDEAL_POSTCODES_API_KEY in Codemagic and
# uncomment the two --dart-define lines below. Without them the app still runs
# (Esri imagery + sample addresses). Supabase + Stripe test keys are built in.

workflows:
  ios-testflight:
    name: MOWR iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Auto-build on push (like `eas build`): once the repo is connected in
    # Codemagic (which installs the webhook), pushing these branches fires a
    # build → TestFlight. No need to click "Start build".
    triggering:
      events:
        - push
      cancel_previous_builds: true
      branch_patterns:
        - pattern: feat/mower-earnings-and-payouts
          include: true
          source: true
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: mowr
    environment:
      vars:
        BUNDLE_ID: "uk.co.mowr.mowr"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          set -e
          # --- diagnostic: are the App Store Connect creds injected? ---
          echo "ISSUER_ID present:  ${APP_STORE_CONNECT_ISSUER_ID:+YES}"
          echo "KEY_ID present:     ${APP_STORE_CONNECT_KEY_IDENTIFIER:+YES}"
          echo "PRIVATE_KEY present:${APP_STORE_CONNECT_PRIVATE_KEY:+YES}"
          # ------------------------------------------------------------
          keychain initialize
          # 1) Generate a private key, then create a distribution certificate
          #    from it, passing the API creds explicitly.
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect certificates create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/cert_key.pem \
            --save
          # 2) Create/fetch the App Store provisioning profile, tied to that key.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          # 3) Import the cert into the keychain and apply the profile.
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          # Codemagic provides an auto-incrementing $BUILD_NUMBER per build —
          # no Apple ID lookup needed.
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($BUILD_NUMBER)) \
            --export-options-plist=/Users/builder/export_options.plist
          # To enable optional keys, add these back on the flutter build line:
          #   --dart-define=MAPBOX_TOKEN=$MAPBOX_TOKEN \
          #   --dart-define=IDEAL_POSTCODES_API_KEY=$IDEAL_POSTCODES_API_KEY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Leave beta groups empty to just upload; add group names to auto-assign:
        # beta_groups:
        #   - Internal testers
